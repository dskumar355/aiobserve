[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiobserve"
version = "0.1.1"
description = "Lightweight, provider-neutral AI cost tracking and observability for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "AIObserve Contributors" }
]

keywords = [
    "ai",
    "llm",
    "observability",
    "cost-tracking",
    "telemetry",
    "python",
    "token-usage",
    "ai-monitoring"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1.2",
    "twine>=5",
    "ruff>=0.6"
]

openai = [
    "openai>=1.40"
]

anthropic = [
    "anthropic>=0.34"
]

gemini = [
    "google-genai>=1.0"
]

[project.scripts]
aiobserve = "aiobserve.cli.main:main"

[project.urls]
Homepage = "https://github.com/dskumar355/aiobserve"
Repository = "https://github.com/dskumar355/aiobserve"
Issues = "https://github.com/dskumar355/aiobserve/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"